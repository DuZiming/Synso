[package]
name = "synso-core"
description = "Synso core: file-index data model and SQLite store (embeddable, no UI deps)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Optional serde support for the facade DATA types (the app layer and JSON
# bridges enable it; core stays dependency-lean without it for Phase 2/3
# embedders).
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
rusqlite.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
jwalk.workspace = true
globset.workspace = true
log.workspace = true
notify.workspace = true
pinyin.workspace = true
sysinfo.workspace = true
xxhash-rust.workspace = true
trash.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Asserts the serde spellings of the facade data types (the JSON contract
# the app's IPC serves; see the DedupPhase test in engine.rs).
serde_json = "1"

[target.'cfg(windows)'.dev-dependencies]
junction.workspace = true
