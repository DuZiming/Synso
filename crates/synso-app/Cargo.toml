[package]
name = "synso-app"
description = "Synso desktop application: Tauri v2 shell over the synso-core engine"
version.workspace = true
edition.workspace = true
# The ENGINE keeps the workspace MSRV of 1.83 (`cargo +1.83 check -p
# synso-core`); this crate tracks the Tauri v2 dependency stack, whose
# resolved floor (tauri 2.12.x) is Rust 1.90 — the 1.83 check therefore
# does NOT cover synso-app (per the Task 13 controller ruling).
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix avoids a Windows-only lib/bin name clash
# (https://github.com/rust-lang/cargo/issues/8519, same as the template).
name = "synso_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
synso-core = { path = "../synso-core", features = ["serde"] }
# Process-memory sampling for the memlog thread (v1.1 Task 6); same
# version as the workspace's, but with the `system` feature (processes +
# memory) — core only needs `disk`.
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
# tray-icon: the built-in v2 tray (Task 19). image-png/image-ico: decode the
# bundled placeholder icon for the tray (and window icons come from the
# bundle section of tauri.conf.json).
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
# Task 19: native confirm dialog for the mid-scan quit confirmation,
# OS autostart registration, and single-instance (second launch focuses
# the running app). All driven from Rust; no webview permissions needed.
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# OS UI language for the tray menu's "auto" resolution (see tray.rs);
# the crate is already in the graph via synso-core — this only widens
# the feature set.
windows = { workspace = true, features = ["Win32_Globalization"] }
serde = { version = "1", features = ["derive"] }
crossbeam-channel.workspace = true
# Facade logging; the file backend lives in `logging.rs` (Task 19).
# `std` is opt-in since log 0.4.34 dropped its default features (the
# engine stays lean; only the backend needs a real writer + boxed Log).
log = { workspace = true, features = ["std"] }

[dev-dependencies]
# The logging rotation tests need a throwaway directory.
tempfile.workspace = true
